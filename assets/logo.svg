<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="12" y1="12" x2="116" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="ctxBar" x1="68" y1="62" x2="104" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="q1Bar" x1="24" y1="80" x2="60" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="q2Bar" x1="68" y1="80" x2="104" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded terminal frame (~10% transparent padding, visible on both light & dark themes) -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="url(#bg)" stroke="#475569" stroke-width="2.5"/>

  <!-- Top prompt area -->
  <path d="M27 31 L36 37 L27 43" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="42" y="40" width="14" height="3.5" rx="1.75" fill="#94A3B8"/>
  <circle cx="99" cy="37" r="4.5" fill="#4ADE80"/>

  <!-- Divider between prompt and HUD -->
  <line x1="22" y1="52" x2="106" y2="52" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- HUD Line 1: state dot, model pill, context usage bar -->
  <circle cx="27" cy="64" r="3.5" fill="#22D3EE"/>
  <rect x="35" y="60.5" width="26" height="7" rx="3.5" fill="#C084FC"/>
  <rect x="67" y="60.5" width="37" height="7" rx="3.5" fill="#273244"/>
  <rect x="67" y="60.5" width="23" height="7" rx="3.5" fill="url(#ctxBar)"/>

  <!-- HUD Line 2: dual quota bars -->
  <rect x="24" y="77" width="37" height="7" rx="3.5" fill="#273244"/>
  <rect x="24" y="77" width="16" height="7" rx="3.5" fill="url(#q1Bar)"/>
  <rect x="67" y="77" width="37" height="7" rx="3.5" fill="#273244"/>
  <rect x="67" y="77" width="26" height="7" rx="3.5" fill="url(#q2Bar)"/>

  <!-- HUD Line 3: telemetry metric pills -->
  <rect x="24" y="93.5" width="22" height="6" rx="3" fill="#64748B"/>
  <rect x="51" y="93.5" width="28" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="84" y="93.5" width="20" height="6" rx="3" fill="#FACC15"/>
</svg>
